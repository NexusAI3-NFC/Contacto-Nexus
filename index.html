<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nexus — Contacto</title>
<meta name="description" content="Contacta con Nexus NFC. Conecta tu negocio con los clientes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0d0d;
    --card: #121212;
    --card-border: #232323;
    --orange: #f7931e;
    --orange-deep: #e8590c;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --text-faint: #5a5a5a;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(247,147,30,0.15), transparent 45%),
      radial-gradient(circle at 90% 70%, rgba(232,89,12,0.08), transparent 40%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:600px;
    margin:0 auto;
    padding: 48px 24px 56px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .logo-img{
    width:150px;
    max-width:44vw;
    height:auto;
    margin-bottom:14px;
    filter: drop-shadow(0 8px 24px rgba(247,147,30,0.25));
  }

  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.7rem;
    letter-spacing:0.03em;
    margin-bottom:32px;
  }
  .brand-name .x{ color: var(--orange); }

  .intro-text{
    color: var(--text-dim);
    font-size:1.05rem;
    line-height:1.65;
    max-width:440px;
    margin-bottom:30px;
  }

  /* Email — fused with the background, but standing out as the main action */
  .email-link{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color: var(--text);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.35rem;
    letter-spacing:-0.01em;
    padding: 12px 6px;
    margin-bottom:38px;
    border-bottom:1px solid transparent;
    transition: all 0.2s ease;
  }
  .email-link:hover{
    color: var(--orange);
    border-bottom-color: rgba(247,147,30,0.5);
  }
  .email-link .dot{
    width:7px;height:7px;
    border-radius:50%;
    background: var(--orange);
    box-shadow: 0 0 10px 2px rgba(247,147,30,0.55);
    transition: box-shadow 0.2s ease;
  }
  .email-link:hover .dot{ box-shadow: 0 0 14px 3px rgba(247,147,30,0.8); }

  @media (max-width:480px){
    .email-link{ font-size:1.05rem; }
  }

  .catalog-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:-0.01em;
    text-decoration:none;
    color: var(--text);
    padding: 16px 38px;
    border-radius:100px;
    background: linear-gradient(90deg, var(--orange), var(--orange-deep));
    display:inline-block;
    transition: all 0.25s ease;
    box-shadow: 0 8px 26px -10px rgba(247,147,30,0.55);
    margin-bottom:16px;
  }
  .catalog-title:hover{
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 34px -10px rgba(247,147,30,0.7);
  }

  .tagline{
    color: var(--text-dim);
    font-size:1.02rem;
    font-weight:500;
    letter-spacing:0.01em;
    margin-bottom:48px;
  }

  /* Contact section */
  .contact-block{
    width:100%;
    max-width:360px;
    border-top:1px solid var(--card-border);
    padding-top:30px;
  }
  .contact-heading{
    font-family:'Space Grotesk', sans-serif;
    font-size:0.8rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color: var(--text-faint);
    margin-bottom:20px;
  }
  .contact-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .contact-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:14px 18px;
    text-decoration:none;
    transition: all 0.2s ease;
  }
  .contact-row:hover{
    border-color: rgba(247,147,30,0.4);
    transform: translateY(-1px);
  }
  .contact-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1rem;
    color: var(--text);
  }
  .contact-phone{
    font-size:0.95rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .contact-row:hover .contact-phone{ color: var(--orange); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
  :focus-visible{
    outline:2px solid var(--orange);
    outline-offset:3px;
    border-radius:4px;
  }

  @media (max-width:480px){
    .catalog-title{ font-size:1.25rem; padding:14px 26px; }
    .logo-img{ width:120px; }
  }
</style>
</head>
